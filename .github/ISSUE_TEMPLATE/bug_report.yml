name: 🐛 Bug Report
description: Report an issue or unexpected behavior in UNO Mates
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide as much detail as possible to help us reproduce and resolve the problem quickly.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe what happened...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Create a room with 4 seats
        2. Join on mobile device
        3. Play a Draw 2 card
        4. See error...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
      placeholder: The card should be placed on the discard pile and the next player draws 2...
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened instead.
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment & Device Details
      description: What browser and operating system were you using?
      value: |
        - OS: [e.g. iOS 17, Android 14, Windows 11, macOS 14]
        - Browser: [e.g. Chrome 124, Safari 17, Firefox 125]
        - Device: [e.g. iPhone 15, Pixel 8, Desktop]
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or Screen Recordings
      description: Drag and drop screenshots, screen recordings, or console error logs here if applicable.
    validations:
      required: false
  - type: checkboxes
    id: confirmation
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues and confirmed this bug has not already been reported.
          required: true
        - label: I am using the latest version of the application or the deployed instance.
          required: false
